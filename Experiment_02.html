<!DOCTYPE html>
<html>
    <head>
        <title>Experiment-2</title>
    </head>

    <body>
        <table align="center" border="1">
            <tr>
                <td>Audio</td>
                <td>
                    <audio src="your-audio-file.mp3" controls>
                        Audio
                    </audio>
                </td>
            </tr>

            <tr>
                <td>Video</td>
                <td>
                    <video src="https://youtu.be/XsZZQPKLChY" width="320" height="240" controls>
                        Video
                    </video>
                </td>
            </tr>

            <tr>
                <td>iFrame (YouTube)</td>
                <td>
                    <iframe 
                        width="320" 
                        height="240" 
                        src="https://www.youtube.com/embed/XsZZQPKLChY" 
                        title="YouTube video player" 
                        frameborder="0" 
                        allowfullscreen>
                    </iframe>
                </td>
            </tr>
        </table>
    </body>
</html>
